<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEX Robotics Attendance</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans select-none">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="bg-red-600 text-white font-black px-2.5 py-1 rounded text-lg tracking-wider">VEX</span>
      <h1 class="text-lg font-bold">Robotics Lab Attendance</h1>
    </div>
    <button id="toggleViewBtn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
      <i data-lucide="shield" class="w-4 h-4"></i>
      <span id="toggleViewText">Admin Dashboard</span>
    </button>
  </header>

  <!-- Hidden input to capture iPad/Hardware Scans reliably -->
  <input id="hiddenInput" type="text" class="absolute opacity-0 pointer-events-none" autocomplete="off" />

  <!-- ================= KIOSK VIEW ================= -->
  <main id="kioskView" class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-2xl mx-auto w-full">
    <!-- 3-Second Confirmation Banner -->
    <div id="statusBanner" class="hidden w-full mb-8 p-5 rounded-xl font-bold text-lg flex items-center justify-center gap-3 shadow-lg transition-all">
      <i id="bannerIcon" data-lucide="check-circle" class="w-6 h-6"></i>
      <span id="bannerText"></span>
    </div>

    <!-- Scanner Target Display -->
    <div class="w-full bg-gray-800 border-2 border-dashed border-gray-600 rounded-2xl p-12 flex flex-col items-center gap-5 shadow-2xl">
      <div class="w-20 h-20 rounded-full bg-gray-700 flex items-center justify-center text-red-500">
        <i data-lucide="scan" class="w-10 h-10"></i>
      </div>
      <div>
        <h2 class="text-2xl font-bold mb-2">Tap Student Badge</h2>
        <p class="text-gray-400 text-sm">Hold your card against the reader to check in.</p>
      </div>
    </div>
  </main>

  <!-- ================= ADMIN VIEW ================= -->
  <main id="adminView" class="hidden flex-1 max-w-5xl w-full mx-auto p-6 flex-col gap-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-700 pb-4">
      <div class="flex gap-2">
        <button id="tabLogsBtn" class="bg-red-600 px-4 py-2 rounded-md text-sm font-semibold">Attendance Logs</button>
        <button id="tabStudentsBtn" class="bg-gray-700 px-4 py-2 rounded-md text-sm font-semibold">Registered Students</button>
      </div>
      <button id="exportCsvBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-md text-sm font-semibold flex items-center gap-2">
        <i data-lucide="download" class="w-4 h-4"></i> Export CSV
      </button>
    </div>

    <!-- Logs Table -->
    <div id="logsSection" class="bg-gray-800 rounded-xl overflow-x-auto border border-gray-700">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-700 text-gray-300">
          <tr>
            <th class="p-3.5">Student Name</th>
            <th class="p-3.5">Card ID</th>
            <th class="p-3.5">Date</th>
            <th class="p-3.5">Time</th>
            <th class="p-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="logsTableBody" class="divide-y divide-gray-700">
          <tr><td colspan="5" class="p-4 text-center text-gray-400">Loading records...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Students Table -->
    <div id="studentsSection" class="hidden bg-gray-800 rounded-xl overflow-x-auto border border-gray-700">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-700 text-gray-300">
          <tr>
            <th class="p-3.5">Student Name</th>
            <th class="p-3.5">Assigned Card ID</th>
            <th class="p-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody" class="divide-y divide-gray-700">
          <tr><td colspan="3" class="p-4 text-center text-gray-400">Loading students...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- ================= MODAL: UNREGISTERED CARD ================= -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 rounded-2xl max-w-md w-full p-6 border border-gray-700 shadow-2xl">
      <h3 class="text-xl font-bold mb-2">New Card Detected</h3>
      <p class="text-gray-400 text-sm mb-4">
        Card <strong id="modalCardId" class="text-white font-mono"></strong> is not registered. Enter the student's name:
      </p>
      <form id="registerForm">
        <input id="newStudentName" type="text" placeholder="e.g. John Doe" required
          class="w-full px-4 py-2.5 rounded-lg bg-gray-900 border border-gray-600 focus:outline-none focus:border-red-500 mb-4" />
        <div class="flex justify-end gap-3">
          <button type="button" id="cancelRegisterBtn" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm">Cancel</button>
          <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded-lg text-sm">Register & Check In</button>
        </div>
      </form>
    </div>
  </div>
