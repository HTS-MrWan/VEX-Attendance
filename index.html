<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEX Robotics Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans select-none">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="bg-red-600 text-white font-black px-2.5 py-1 rounded text-lg tracking-wider">VEX</span>
      <h1 class="text-lg font-bold">Robotics Lab Attendance</h1>
    </div>
    <button id="toggleViewBtn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
      <i data-lucide="shield" class="w-4 h-4"></i>
      <span id="toggleViewText">Admin Dashboard</span>
    </button>
  </header>

  <!-- ================= KIOSK VIEW ================= -->
  <main id="kioskView" class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-xl mx-auto w-full">
    <!-- 3-Second Confirmation Banner -->
    <div id="statusBanner" class="hidden w-full mb-6 p-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 shadow-lg">
      <i id="bannerIcon" data-lucide="check-circle" class="w-6 h-6"></i>
      <span id="bannerText"></span>
    </div>

    <!-- Scanner Target Display -->
    <div class="w-full bg-gray-800 border-2 border-dashed border-gray-600 rounded-2xl p-8 flex flex-col items-center gap-4 shadow-xl">
      <div class="w-16 h-16 rounded-full bg-gray-700 flex items-center justify-center text-red-500">
        <i data-lucide="scan" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold mb-1">Tap Student Badge</h2>
        <p class="text-gray-400 text-sm">Hold card near the reader to check in.</p>
      </div>

      <!-- Live Input Box -->
      <form id="scanForm" class="w-full mt-2 flex gap-2">
        <input id="cardInput" type="text" placeholder="Scanning card..." autocomplete="off"
          class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-center text-lg font-mono tracking-widest text-white focus:outline-none focus:border-red-500" />
        <button type="submit" class="bg-red-600 hover:bg-red-500 text-white px-5 py-3 rounded-lg font-semibold text-sm">Submit</button>
      </form>
    </div>
  </main>

  <!-- ================= ADMIN VIEW ================= -->
  <main id="adminView" class="hidden flex-1 max-w-5xl w-full mx-auto p-6 flex-col gap-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-700 pb-4">
      <div class="flex gap-2">
        <button id="tabLogsBtn" class="bg-red-600 px-4 py-2 rounded-md text-sm font-semibold">Attendance Logs</button>
        <button id="tabStudentsBtn" class="bg-gray-700 px-4 py-2 rounded-md text-sm font-semibold">Registered Students</button>
      </div>
      <button id="exportCsvBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-md text-sm font-semibold flex items-center gap-2">
        <i data-lucide="download" class="w-4 h-4"></i> Export CSV
      </button>
    </div>

    <!-- Logs Table -->
    <div id="logsSection" class="bg-gray-800 rounded-xl overflow-x-auto border border-gray-700">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-700 text-gray-300">
          <tr>
            <th class="p-3.5">Student Name</th>
            <th class="p-3.5">Card ID</th>
            <th class="p-3.5">Date</th>
            <th class="p-3.5">Time</th>
            <th class="p-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="logsTableBody" class="divide-y divide-gray-700">
          <tr><td colspan="5" class="p-4 text-center text-gray-400">Loading records...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Students Table -->
    <div id="studentsSection" class="hidden bg-gray-800 rounded-xl overflow-x-auto border border-gray-700">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-700 text-gray-300">
          <tr>
            <th class="p-3.5">Student Name</th>
            <th class="p-3.5">Assigned Card ID</th>
            <th class="p-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody" class="divide-y divide-gray-700">
          <tr><td colspan="3" class="p-4 text-center text-gray-400">Loading students...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- ================= MODAL: UNREGISTERED CARD ================= -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 rounded-2xl max-w-md w-full p-6 border border-gray-700 shadow-2xl">
      <h3 class="text-xl font-bold mb-2">New Card Detected</h3>
      <p class="text-gray-400 text-sm mb-4">
        Card <strong id="modalCardId" class="text-white font-mono"></strong> is not registered. Enter student name:
      </p>
      
      <div id="modalError" class="hidden mb-4 p-3 bg-red-950/80 border border-red-700 text-red-200 text-xs rounded-lg"></div>

      <form id="registerForm">
        <input id="newStudentName" type="text" placeholder="e.g. Ronny Wan" required
          class="w-full px-4 py-2.5 rounded-lg bg-gray-900 border border-gray-600 focus:outline-none focus:border-red-500 mb-4 text-white" />
        <div class="flex justify-end gap-3">
          <button type="button" id="cancelRegisterBtn" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm">Cancel</button>
          <button type="submit" id="submitRegisterBtn" class="bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded-lg text-sm">
            Register & Check In
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc,
      query, where, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBp5weR493oNyMAqqVJ29ephpOE6ZuOGEE",
      authDomain: "vex-sign-in.firebaseapp.com",
      projectId: "vex-sign-in",
      storageBucket: "vex-sign-in.firebasestorage.app",
      messagingSenderId: "937126385405",
      appId: "1:937126385405:web:319142911247e2ce1c1094",
      measurementId: "G-SPCRBPF386"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentView = "kiosk";
    let pendingCardId = null;
    let cachedLogs = [];
    let cachedStudents = [];

    const kioskView = document.getElementById("kioskView");
    const adminView = document.getElementById("adminView");
    const toggleViewBtn = document.getElementById("toggleViewBtn");
    const toggleViewText = document.getElementById("toggleViewText");
    const statusBanner = document.getElementById("statusBanner");
    const bannerText = document.getElementById("bannerText");
    const registerModal = document.getElementById("registerModal");
    const modalCardId = document.getElementById("modalCardId");
    const modalError = document.getElementById("modalError");
    const registerForm = document.getElementById("registerForm");
    const newStudentNameInput = document.getElementById("newStudentName");
    const cancelRegisterBtn = document.getElementById("cancelRegisterBtn");
    const submitRegisterBtn = document.getElementById("submitRegisterBtn");
    const cardInput = document.getElementById("cardInput");
    const scanForm = document.getElementById("scanForm");
    const tabLogsBtn = document.getElementById("tabLogsBtn");
    const tabStudentsBtn = document.getElementById("tabStudentsBtn");
    const logsSection = document.getElementById("logsSection");
    const studentsSection = document.getElementById("studentsSection");
    const logsTableBody = document.getElementById("logsTableBody");
    const studentsTableBody = document.getElementById("studentsTableBody");
    const exportCsvBtn = document.getElementById("exportCsvBtn");

    lucide.createIcons();

    function focusInput() {
      if (currentView === "kiosk" && registerModal.classList.contains("hidden")) {
        cardInput.focus();
      }
    }
    document.addEventListener("click", focusInput);
    focusInput();

    cardInput.addEventListener("input", (e) => {
      const val = e.target.value.trim();
      if (val.length >= 10) {
        processScan(val);
      }
    });

    scanForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = cardInput.value.trim();
      if (val) processScan(val);
    });

    async function processScan(cardId) {
      cardInput.value = "";
      modalError.classList.add("hidden");

      try {
        const q = query(collection(db, "students"), where("cardId", "==", cardId));
        const snap = await getDocs(q);

        if (snap.empty) {
          pendingCardId = cardId;
          modalCardId.textContent = cardId;
          registerModal.classList.remove("hidden");
          newStudentNameInput.focus();
        } else {
          const student = snap.docs[0].data();
          await recordAttendance(cardId, student.name);
        }
      } catch (err) {
        console.error("Firestore read error:", err);
        showBanner(false, `Read Error: ${err.message}`);
      }
    }

    async function recordAttendance(cardId, name) {
      const now = new Date();
      await addDoc(collection(db, "attendance"), {
        cardId: cardId,
        studentName: name,
        timestamp: serverTimestamp(),
        localDate: now.toLocaleDateString('en-CA'),
        localTime: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      });
      showBanner(true, `${name} has checked into VEX robotics today!`);
    }

    let bannerTimer = null;
    function showBanner(success, message) {
      clearTimeout(bannerTimer);
      statusBanner.className = `w-full mb-6 p-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 shadow-lg ${
        success ? "bg-emerald-700 text-white" : "bg-red-700 text-white"
      }`;
      bannerText.textContent = message;
      statusBanner.classList.remove("hidden");
      bannerTimer = setTimeout(() => {
        statusBanner.classList.add("hidden");
        focusInput();
      }, 3000);
    }

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = newStudentNameInput.value.trim();
      const card = pendingCardId;
      if (!name || !card) return;

      submitRegisterBtn.disabled = true;
      submitRegisterBtn.textContent = "Saving...";
      modalError.classList.add("hidden");

      try {
        await addDoc(collection(db, "students"), {
          cardId: card,
          name: name,
          registeredAt: serverTimestamp()
        });

        await recordAttendance(card, name);
        registerModal.classList.add("hidden");
        newStudentNameInput.value = "";
        pendingCardId = null;
        focusInput();
      } catch (err) {
        console.error("Registration write error:", err);
        modalError.textContent = `Database Error: ${err.message}`;
        modalError.classList.remove("hidden");
      } finally {
        submitRegisterBtn.disabled = false;
        submitRegisterBtn.textContent = "Register & Check In";
      }
    });

    cancelRegisterBtn.addEventListener("click", () => {
      registerModal.classList.add("hidden");
      modalError.classList.add("hidden");
      newStudentNameInput.value = "";
      pendingCardId = null;
      focusInput();
    });

    toggleViewBtn.addEventListener("click", () => {
      if (currentView === "kiosk") {
        currentView = "admin";
        kioskView.classList.add("hidden");
        adminView.classList.remove("hidden");
        adminView.classList.add("flex");
        toggleViewText.textContent = "Kiosk Mode";
        loadAdminData();
      } else {
        currentView = "kiosk";
        adminView.classList.add("hidden");
        adminView.classList.remove("flex");
        kioskView.classList.remove("hidden");
        toggleViewText.textContent = "Admin Dashboard";
        focusInput();
      }
    });

    tabLogsBtn.addEventListener("click", () => {
      tabLogsBtn.className = "bg-red-600 px-4 py-2 rounded-md text-sm font-semibold";
      tabStudentsBtn.className = "bg-gray-700 px-4 py-2 rounded-md text-sm font-semibold";
      logsSection.classList.remove("hidden");
      studentsSection.classList.add("hidden");
    });

    tabStudentsBtn.addEventListener("click", () => {
      tabStudentsBtn.className = "bg-red-600 px-4 py-2 rounded-md text-sm font-semibold";
      tabLogsBtn.className = "bg-gray-700 px-4 py-2 rounded-md text-sm font-semibold";
      studentsSection.classList.remove("hidden");
      logsSection.classList.add("hidden");
    });

    async function loadAdminData() {
      const logsSnap = await getDocs(query(collection(db, "attendance"), orderBy("timestamp", "desc")));
      cachedLogs = logsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderLogs();

      const stuSnap = await getDocs(query(collection(db, "students"), orderBy("name", "asc")));
      cachedStudents = stuSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderStudents();
    }

    function renderLogs() {
      if (cachedLogs.length === 0) {
        logsTableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No logs found.</td></tr>`;
        return;
      }
      logsTableBody.innerHTML = cachedLogs.map(log => `
        <tr class="hover:bg-gray-750">
          <td class="p-3.5 font-semibold text-white">${log.studentName}</td>
          <td class="p-3.5 font-mono text-gray-400">${log.cardId}</td>
